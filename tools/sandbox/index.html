<title>YSave Sandbox</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: a workbench. A clock strip on top, tabs, then two working columns that stack on a phone.
   Deliberately dark only: it sits next to the moments player, which has one fixed graphite look. */
:root {
  color-scheme: dark;
  --bg: #0e1013;
  --panel: #15181d;
  --line: #262a32;
  --fg: #eceef1;
  --dim: #8d939d;
  --sun: #f7d45e;
  --sun-ink: #1d1a0c;
  --ok: #6fcf97;
  --warn: #e9a15b;
  --bad: #ef7a7a;
  --gold: #f2c94c;
  --c-study: #7aa7ff; --c-health: #6fcf97; --c-home: #e9a15b; --c-sun: #f7d45e; --c-c4: #c49bff; --c-c5: #ff8fab; --c-none: #8d939d;
  --ui: 'PlusJakartaSans_400Regular', 'Segoe UI', system-ui, sans-serif;
  --ui-strong: 'PlusJakartaSans_600SemiBold', 'Segoe UI', system-ui, sans-serif;
  --display: 'PlusJakartaSans_800ExtraBold', 'Segoe UI', system-ui, sans-serif;
  --mono: 'IBMPlexMono_500Medium', ui-monospace, Consolas, monospace;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font: 14px/1.5 var(--ui); }
#root { min-height: 100%; }
.boot { padding: 48px 16px; color: var(--dim); font-family: var(--mono); }
.shell { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 48px; max-width: 1280px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
h1 { font: 22px/1.1 var(--display); margin: 0; letter-spacing: -0.01em; }
h2 { font: 16px/1.3 var(--ui-strong); margin: 0 0 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; text-wrap: balance; }
h3 { font: 12px/1.3 var(--mono); text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); margin: 20px 0 8px; }
p { margin: 0; }
.sub, .dim { color: var(--dim); }
.small { font-size: 12px; }
b { font-family: var(--ui-strong); font-weight: normal; }

.top { display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; align-items: flex-start; }
.brand { display: flex; gap: 12px; align-items: center; min-width: 0; }
.mark { width: 30px; height: 30px; border-radius: 50%; border: 5px solid var(--sun); border-right-color: transparent; transform: rotate(40deg); flex: none; }
.clock { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.now { font: 20px/1.1 var(--mono); color: var(--sun); font-variant-numeric: tabular-nums; }
.clock .dim b { color: var(--fg); font-family: var(--mono); }

.tabs { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; border-bottom: 1px solid var(--line); }
.tab { background: none; border: 0; border-bottom: 2px solid transparent; border-radius: 0; color: var(--dim); padding: 8px 10px; }
.tab.on { color: var(--fg); border-bottom-color: var(--sun); }
.phone { margin-left: auto; color: var(--dim); font-size: 12px; display: flex; gap: 6px; align-items: center; padding: 6px 0; }

.grid2 { display: grid; grid-template-columns: minmax(0, 1.15fr) minmax(0, 1fr); gap: 16px; align-items: start; }
@media (max-width: 860px) { .grid2 { grid-template-columns: minmax(0, 1fr); } .phone { margin-left: 0; } }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px; min-width: 0; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.row { display: flex; gap: 8px; align-items: center; }
.row.wrap { flex-wrap: wrap; }

button, select, input, textarea { font: inherit; color: var(--fg); background: #1c2027; border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
button { cursor: pointer; }
button:hover { border-color: #3a404b; }
button:disabled { opacity: 0.45; cursor: not-allowed; }
button.primary { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); font-family: var(--ui-strong); }
button.mini { padding: 2px 8px; min-width: 28px; }
button.chip { border-radius: 999px; font-size: 12px; }
button.chip.on { border-color: var(--sun); color: var(--sun); }
:focus-visible { outline: 2px solid var(--sun); outline-offset: 2px; }
input[type=checkbox] { accent-color: var(--sun); width: 16px; height: 16px; padding: 0; }
textarea { width: 100%; font-family: var(--mono); font-size: 12px; box-sizing: border-box; }
input.cell { width: 52px; text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; padding: 4px 6px; }

.pill { font: 11px/1 var(--mono); padding: 4px 7px; border-radius: 999px; border: 1px solid currentColor; text-transform: uppercase; letter-spacing: 0.04em; }
.pill.ok { color: var(--ok); } .pill.warn { color: var(--warn); } .pill.done { color: var(--dim); } .pill.gold { color: var(--gold); }

.tasks, .plain, .log { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
.task { border: 1px solid var(--line); border-radius: 10px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.task.running { border-color: var(--ok); }
.tline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.tline .dim { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--sun); }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--c-none); }
.c-study { background: var(--c-study); } .c-health { background: var(--c-health); } .c-home { background: var(--c-home); } .c-sun { background: var(--c-sun); } .c-c4 { background: var(--c-c4); } .c-c5 { background: var(--c-c5); }
.prow { justify-content: space-between; border-bottom: 1px dashed var(--line); padding-bottom: 6px; }
.num { font-family: var(--mono); min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.note { border-left: 3px solid var(--sun); padding: 6px 10px; background: #1b1d17; border-radius: 0 8px 8px 0; }

.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 14px; margin: 0; }
.kv dt { color: var(--dim); }
.kv dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }

.scroll { overflow-x: auto; max-width: 100%; }
table.script { border-collapse: collapse; font-size: 13px; min-width: 100%; }
.script th, .script td { border-bottom: 1px solid var(--line); padding: 5px 6px; text-align: left; white-space: nowrap; }
.script thead th { font: 11px/1.2 var(--mono); color: var(--dim); text-transform: uppercase; letter-spacing: 0.05em; }
.script tbody th { font-family: var(--mono); font-weight: normal; font-variant-numeric: tabular-nums; }
.script tr.future th { color: var(--sun); }
.days { display: flex; gap: 2px; }
.dd { padding: 2px 6px; font-size: 11px; color: var(--dim); }
.dd.on { color: var(--sun-ink); background: var(--sun); border-color: var(--sun); }

.cal { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dow { font: 11px var(--mono); color: var(--dim); text-align: center; }
.dayc { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 6px 2px; min-height: 48px; font-family: var(--mono); }
.dayc small { font-size: 10px; color: var(--dim); font-variant-numeric: tabular-nums; }
.dayc.hand { border-color: #4d5a3a; background: #1a2016; }
.dayc.auto { border-style: dashed; }
.dayc.today { border-color: var(--sun); }
.dayc.pick { outline: 2px solid var(--fg); outline-offset: 1px; }
.legend { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-top: 10px; }
.sw { width: 12px; height: 12px; border-radius: 3px; border: 1px solid var(--line); display: inline-block; }
.sw.hand { background: #1a2016; border-color: #4d5a3a; } .sw.auto { border-style: dashed; } .sw.today { border-color: var(--sun); }

.log li { font-family: var(--mono); font-size: 12px; border-bottom: 1px solid var(--line); padding: 4px 0; overflow-wrap: anywhere; }
.log time { color: var(--dim); margin-right: 8px; }
.lk-error { color: var(--bad); } .lk-moments { color: var(--sun); } .lk-auto { color: var(--warn); }
.bad { color: var(--bad); }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: #232831; border: 1px solid var(--line); color: var(--fg); padding: 10px 14px; border-radius: 10px; max-width: min(560px, calc(100vw - 32px)); z-index: 5; }
.toast.bad { border-color: var(--bad); }

/* The speed bar floats above the player (react-native-web puts the player's modal at the end of <body>). */
.playback { position: fixed; z-index: 2147483647; left: 50%; transform: translateX(-50%); bottom: calc(8px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 4px; align-items: center; flex-wrap: wrap; justify-content: center; max-width: calc(100vw - 16px); background: rgba(21, 24, 29, 0.92); border: 1px solid var(--line); border-radius: 12px; padding: 6px; }
.playback button { padding: 4px 9px; font: 12px/1.2 var(--mono); }
.playback button.on { background: var(--sun); color: var(--sun-ink); border-color: var(--sun); }
.playback .pt { font: 12px var(--mono); color: var(--sun); min-width: 54px; text-align: right; padding-right: 4px; font-variant-numeric: tabular-nums; }
/* Wide windows: beside the 412 px phone frame instead of over its bottom (where Skip sits). */
@media (min-width: 1000px) { .playback { left: 16px; bottom: auto; top: 50%; transform: translateY(-50%); flex-direction: column; align-items: stretch; width: 150px; } .playback .pt { text-align: center; } .playback input[type=range] { width: auto; } }
.playback .sp { min-width: 48px; text-align: left; color: var(--fg); }
.playback input[type=range] { width: 120px; accent-color: var(--sun); padding: 0; background: none; border: 0; }

/* Pixel 9a size: the player lays out for 412x915; centre that box and scale it down to fit a shorter window. */
html.phone-frame [aria-modal="true"] { width: 412px !important; height: 915px !important; left: 50% !important; top: 50% !important; right: auto !important; bottom: auto !important; transform: translate(-50%, -50%) scale(var(--fit, 1)); box-shadow: 0 0 0 100vmax #050607; }
</style>
<div id="root"><p class="boot">Starting the sandbox: loading the app’s code and a fresh database…</p></div>
<script>
  (function () {
    function fit() { document.documentElement.style.setProperty('--fit', String(Math.min(1, (window.innerHeight - 16) / 915, (window.innerWidth - 16) / 412))); }
    fit(); window.addEventListener('resize', fit);
  })();
</script>
<script>
  // Playback speed for the moments player. Reanimated on the web reads time from performance.now() and the
  // requestAnimationFrame timestamp; both are replaced by one virtual clock that runs at `rate` (0 = paused), so the
  // app's own timeline plays slower without any change to its code. Installed before the app bundle loads.
  (function () {
    var realNow = performance.now.bind(performance);
    var rate = 1, baseReal = realNow(), baseVirt = baseReal;
    function v(r) { return baseVirt + (r - baseReal) * rate; }
    function rebase(extra) { var r = realNow(); baseVirt = v(r) + (extra || 0); baseReal = r; }
    performance.now = function () { return v(realNow()); };
    var raf = window.requestAnimationFrame.bind(window);
    window.requestAnimationFrame = function (cb) { return raf(function (ts) { cb(v(ts)); }); };
    window.__sandboxTime = {
      setRate: function (x) { rebase(0); rate = x; },
      step: function (ms) { rebase(ms); },
      now: function () { return v(realNow()); },
      rate: function () { return rate; }
    };
  })();
</script>
<script src="sandbox.js"></script>
